steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/eazyprepai-backend/backend:$SHORT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/eazyprepai-backend/backend:latest'
      - '.'

  # Push the Docker image to Artifact Registry (with commit SHA)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/eazyprepai-backend/backend:$SHORT_SHA'

  # Push the Docker image to Artifact Registry (latest tag)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/eazyprepai-backend/backend:latest'

# Images to be pushed to registry
images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/eazyprepai-backend/backend:$SHORT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/eazyprepai-backend/backend:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Timeout for the entire build
timeout: 1200s
