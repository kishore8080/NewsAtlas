<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>News MCQ Generator</title>
</head>
<body>
    <h1>News MCQ Quiz Generator</h1>
    <form action="/generate" method="post">
        <label for="articles">Paste your news articles:</label><br>
        <textarea name="articles" rows="12" cols="80" placeholder="Paste your 4–6 articles here"></textarea><br><br>
        <button type="submit">Generate MCQs</button>
    </form>
</body>
</html>
